<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ATW - Mini-Jeu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Oswald', Arial, sans-serif;
      margin: 0;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .game-container {
      background: linear-gradient(145deg, #1f1f1f, #111111);
      border: 3px solid #ff0000;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
    }

    h1 {
      color: #ff0000;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
      font-family: Arial, sans-serif;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-back, .btn-flappy {
      background: #ff0000;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 25px;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      transition: all 0.2s ease-in-out;
      display: inline-block;
      border: none;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 1rem;
    }

    .btn-flappy {
      background: #222;
      color: #ff0000;
      border: 2px solid #ff0000;
    }

    .btn-back:hover, .btn-flappy:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
    }

    /* Styles pour le jeu FlappyBoing */
    #flappy-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #flappy-canvas {
      border: 3px solid #ff0000;
      background: #1a1a1a;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      max-width: 100%;
    }

    .flappy-close {
      margin-top: 15px;
      background: #ff0000;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      text-transform: uppercase;
    }

    .flappy-close:hover {
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>ATW Mini-Jeu</h1>
    <p>Le jeu secret est en cours de développement. Prépare-toi à bouncer !</p>
    
    <div id="game-canvas-container" style="margin-bottom: 30px;">
    </div>

    <div class="btn-group">
      <button class="btn-flappy" onclick="startFlappyBoing()">Patienter sur FlappyBoing</button>
      <a href="index.html" class="btn-back">▲ Retour au site</a>
    </div>
  </div>

  <!-- Overlay du mini-jeu FlappyBoing -->
  <div id="flappy-overlay">
    <h2 style="color: #ff0000; text-transform: uppercase; margin-bottom: 10px;">FlappyBoing</h2>
    <canvas id="flappy-canvas" width="400" height="500"></canvas>
    <button class="flappy-close" onclick="closeFlappyBoing()">Quitter</button>
  </div>

  <script>
    let canvas, ctx;
    let gameInterval;
    let bird, pipes, score, isGameOver, isGameStarted;

    function startFlappyBoing() {
      document.getElementById('flappy-overlay').style.display = 'flex';
      canvas = document.getElementById('flappy-canvas');
      ctx = canvas.getContext('2d');
      
      resetGame();
      
      window.addEventListener('keydown', handleKeyPress);
      canvas.addEventListener('click', handleCanvasClick);

      if (!gameInterval) {
        gameInterval = setInterval(updateGame, 1000 / 60);
      }
    }

    function closeFlappyBoing() {
      document.getElementById('flappy-overlay').style.display = 'none';
      clearInterval(gameInterval);
      gameInterval = null;
      window.removeEventListener('keydown', handleKeyPress);
      canvas.removeEventListener('click', handleCanvasClick);
    }

    function resetGame() {
      bird = {
        x: 80,
        y: 250,
        radius: 15,
        gravity: 0.5,
        lift: -8,
        velocity: 0
      };
      pipes = [];
      score = 0;
      isGameOver = false;
      isGameStarted = false;
    }

    function handleKeyPress(e) {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        makeBirdBounce();
      }
    }

    function handleCanvasClick() {
      makeBirdBounce();
    }

    function makeBirdBounce() {
      if (isGameOver) {
        resetGame();
        return;
      }
      isGameStarted = true;
      bird.velocity = bird.lift;
    }

    function updateGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dessiner le fond (style ring/trampoline)
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isGameStarted && !isGameOver) {
        // Gravité
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        // Gestion des tuyaux (poteaux de ring)
        if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
          let minHeight = 50;
          let maxHeight = canvas.height - 200;
          let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
          let gap = 130;
          
          pipes.push({
            x: canvas.width,
            top: height,
            bottom: canvas.height - height - gap,
            passed: false
          });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          pipes[i].x -= 3;

          // Collision
          if (
            bird.x + bird.radius > pipes[i].x && 
            bird.x - bird.radius < pipes[i].x + 60 &&
            (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > canvas.height - pipes[i].bottom)
          ) {
            isGameOver = true;
          }

          // Score
          if (!pipes[i].passed && pipes[i].x + 60 < bird.x) {
            score++;
            pipes[i].passed = true;
          }

          // Supprimer les tuyaux sortants
          if (pipes[i].x < -60) {
            pipes.splice(i, 1);
          }
        }

        // Limites sol/plafond
        if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
          isGameOver = true;
        }
      }

      // Dessiner les poteaux (Obstacles)
      for (let i = 0; i < pipes.length; i++) {
        ctx.fillStyle = '#ff0000';
        // Haut
        ctx.fillRect(pipes[i].x, 0, 60, pipes[i].top);
        // Bas
        ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, 60, pipes[i].bottom);
        
        // Bordure des poteaux
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(pipes[i].x, 0, 60, pipes[i].top);
        ctx.strokeRect(pipes[i].x, canvas.height - pipes[i].bottom, 60, pipes[i].bottom);
      }

      // Dessiner le "Wrestler" (le joueur)
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Affichage du score
      ctx.fillStyle = '#fff';
      ctx.font = '24px "Oswald", Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Score: ' + score, 20, 35);

      // Écran d'accueil / Game Over
      if (!isGameStarted) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.textAlign = 'center';
        ctx.font = '28px "Oswald", Arial';
        ctx.fillText('CLIQUEZ OU ESPACE POUR BOUNCER', canvas.width / 2, canvas.height / 2);
      } else if (isGameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.textAlign = 'center';
        ctx.font = '36px "Oswald", Arial';
        ctx.fillText('KO !', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText('Clique pour recommencer', canvas.width / 2, canvas.height / 2 + 20);
      }
    }
  </script>

</body>
</html>
