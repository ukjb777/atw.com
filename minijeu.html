<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ATW - Mini-Jeu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Oswald', Arial, sans-serif;
      margin: 0;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .game-container {
      background: linear-gradient(145deg, #1f1f1f, #111111);
      border: 3px solid #ff0000;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
    }

    h1 {
      color: #ff0000;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
      font-family: Arial, sans-serif;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-back, .btn-flappy, .btn-idea {
      background: #ff0000;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 25px;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      transition: all 0.2s ease-in-out;
      display: inline-block;
      border: none;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 1rem;
    }

    .btn-flappy, .btn-idea {
      background: #222;
      color: #ff0000;
      border: 2px solid #ff0000;
    }

    .btn-back:hover, .btn-flappy:hover, .btn-idea:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
    }

    /* Overlays */
    #flappy-overlay, #idea-overlay, #secret-drawer-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #flappy-canvas {
      border: 3px solid #ff0000;
      background: #1a1a1a;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      max-width: 100%;
    }

    .flappy-close, .idea-close, .drawer-close {
      margin-top: 15px;
      background: #ff0000;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      text-transform: uppercase;
    }

    .flappy-close:hover, .idea-close:hover, .drawer-close:hover {
      background: #fff;
    }

    /* Boîte à idées publique */
    .idea-box {
      background: #1a1a1a;
      border: 3px solid #ff0000;
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
      text-align: left;
    }

    .form-row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-col {
      flex: 1;
    }

    .idea-box label, .drawer-box h2 {
      display: block;
      color: #ff0000;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .idea-box input, .idea-box textarea {
      width: 100%;
      padding: 10px;
      background: #111;
      border: 2px solid #333;
      color: #fff;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .idea-box input:focus, .idea-box textarea:focus {
      border-color: #ff0000;
      outline: none;
    }

    .idea-box textarea {
      resize: vertical;
      height: 90px;
      margin-bottom: 20px;
    }

    .idea-submit {
      background: #ff0000;
      color: #000;
      border: none;
      padding: 12px;
      width: 100%;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .idea-submit:hover {
      background: #fff;
    }

    #success-msg {
      color: #00ff00;
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    /* Tiroir secret aux dimensions fixes */
    .drawer-box {
      width: 750px;
      height: 650px;
      max-width: 95vw;
      max-height: 90vh;
      background: #161616;
      border: 3px solid #ff0000;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      transform: translateY(-100vh);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      box-sizing: border-box;
    }

    #secret-drawer-overlay.active .drawer-box {
      transform: translateY(0);
      opacity: 1;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #252525;
      padding-bottom: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .drawer-tabs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .drawer-tab {
      background: #111;
      color: #888;
      border: 1px solid #333;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Oswald', Arial, sans-serif;
      font-size: 0.85rem;
      text-transform: uppercase;
      transition: 0.2s;
    }

    .drawer-tab.active {
      background: #ff0000;
      color: #000;
      border-color: #ff0000;
      font-weight: 700;
    }

    .btn-empty-trash {
      background: #500;
      color: #ff8888;
      border: 1px solid #ff0000;
      display: none;
    }
    .btn-empty-trash:hover {
      background: #ff0000;
      color: #000;
    }

    #ideas-list {
      flex: 1;
      overflow-y: auto;
      background: #101010;
      border: 2px solid #222;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    #ideas-list::-webkit-scrollbar {
      width: 8px;
    }
    #ideas-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    #ideas-list::-webkit-scrollbar-thumb:hover {
      background: #ff0000;
    }

    .idea-card {
      background: #181818;
      border: 1px solid #2c2c2c;
      border-left: 4px solid #ff0000;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      transition: all 0.3s ease;
    }

    .idea-card.burning {
      transform: scale(0.9) rotate(2deg);
      opacity: 0;
      filter: brightness(3) sepia(1) hue-rotate(-50deg);
    }

    .idea-card-main {
      flex: 1;
    }

    .idea-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .idea-author {
      color: #ff0000;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .idea-discord {
      background: #222;
      color: #aaa;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: Arial, sans-serif;
    }

    .idea-date {
      color: #666;
      font-size: 0.75rem;
      margin-left: auto;
      font-family: Arial, sans-serif;
    }

    .trash-timer {
      background: #310;
      color: #ffaa55;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: Arial, sans-serif;
    }

    .idea-text {
      color: #ccc;
      font-family: Arial, sans-serif;
      font-size: 0.92rem;
      line-height: 1.4;
      margin: 0;
      word-break: break-word;
    }

    .idea-card-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 110px;
    }

    .action-btn {
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
      text-transform: uppercase;
      font-family: 'Oswald', Arial, sans-serif;
      border: none;
      transition: 0.2s;
      text-align: center;
    }

    .btn-accept { background: #008800; color: #fff; }
    .btn-accept:hover { background: #00cc00; color: #000; }

    .btn-reject { background: #880000; color: #fff; }
    .btn-reject:hover { background: #cc0000; color: #fff; }

    .btn-pending { background: #222; color: #aaa; }
    .btn-pending:hover { background: #444; color: #fff; }

    .btn-trash { background: #2a2a2a; color: #aaa; }
    .btn-trash:hover { background: #444; color: #fff; }

    .btn-restore { background: #0055aa; color: #fff; }
    .btn-restore:hover { background: #0088ff; color: #000; }

    .btn-burn { background: #500; color: #ff8888; }
    .btn-burn:hover { background: #ff0000; color: #000; }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>ATW Mini-Jeu</h1>
    <p>Le jeu secret est en cours de développement. Prépare-toi à bouncer !</p>
    
    <div id="game-canvas-container" style="margin-bottom: 30px;">
    </div>

    <div class="btn-group">
      <button class="btn-flappy" onclick="startFlappyBoing()">Patienter sur FlappyBoing</button>
      <button class="btn-idea" onclick="openIdeaBox()">Boîte à idées</button>
      <a href="index.html" class="btn-back">▲ Retour au site</a>
    </div>
  </div>

  <!-- Overlay FlappyBoing -->
  <div id="flappy-overlay">
    <h2 style="color: #ff0000; text-transform: uppercase; margin-bottom: 10px;">FlappyBoing</h2>
    <canvas id="flappy-canvas" width="400" height="500"></canvas>
    <button class="flappy-close" onclick="closeFlappyBoing()">Quitter</button>
  </div>

  <!-- Overlay Boîte à Idées (Public) -->
  <div id="idea-overlay">
    <div class="idea-box">
      <h2 style="color: #ff0000; text-transform: uppercase; margin-top: 0; margin-bottom: 20px; text-align: center; letter-spacing: 1px;">Boîte à idées mini-jeu</h2>
      
      <div class="form-row">
        <div class="form-col">
          <label for="pseudo">Ton pseudo</label>
          <input type="text" id="pseudo" placeholder="Ex: Ukyo">
        </div>
        <div class="form-col">
          <label for="discord">Ton discord (optionnel)</label>
          <input type="text" id="discord" placeholder="donne bien le bon pseudo">
        </div>
      </div>

      <label for="idea-text">Ton idée de mini-jeu</label>
      <textarea id="idea-text" placeholder="Décris ton concept ici..."></textarea>

      <button class="idea-submit" onclick="submitIdeaOnline()">Envoyer l'idée</button>
      <p id="success-msg">Idée envoyée en ligne avec succès !</p>
      
      <button class="idea-close" style="width: 100%; margin-top: 10px;" onclick="closeIdeaBox()">Fermer</button>
    </div>
  </div>

  <!-- Overlay Tiroir Secret -->
  <div id="secret-drawer-overlay">
    <div class="drawer-box">
      <div class="drawer-header">
        <h2 style="color: #ff0000; text-transform: uppercase; margin: 0; font-size: 1.2rem;">🗄️ Gestion des Idées ATW</h2>
        <div class="drawer-tabs">
          <button class="drawer-tab active" onclick="switchDrawerTab('pending', this)">En attente</button>
          <button class="drawer-tab" onclick="switchDrawerTab('accepted', this)">Acceptées</button>
          <button class="drawer-tab" onclick="switchDrawerTab('rejected', this)">Refusées</button>
          <button class="drawer-tab" onclick="switchDrawerTab('trash', this)">🗑️ Corbeille</button>
          <button class="drawer-tab btn-empty-trash" id="btn-empty-trash" onclick="emptyTrashWithEffect()">🔥 Vider la corbeille</button>
        </div>
      </div>

      <div id="ideas-list">
        <p style="color: #888; text-align: center; padding: 40px;">Chargement des idées en ligne...</p>
      </div>

      <button class="drawer-close" style="width: 100%; margin-top: auto;" onclick="closeSecretDrawer()">Refermer le tiroir</button>
    </div>
  </div>

  <script>
    // URL publique partagée dédiée à vos tests en ligne
    const CLOUD_BIN_URL = "https://json.extendsclass.com/bin/63e147f7d142d54e601c23cb";

    let canvas, ctx;
    let gameInterval;
    let bird, pipes, score, isGameOver, isGameStarted;
    let currentDrawerTab = 'pending';
    let onlineIdeas = [];
    let worldRecord = 0;

    function playDrawerSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(800, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.4);
        filter.Q.value = 3;
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function playBurnSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    async function loadIdeasFromCloud() {
      try {
        let res = await fetch(CLOUD_BIN_URL, { cache: "no-store" });
        let data = await res.json();
        if (data && Array.isArray(data.ideas)) {
          onlineIdeas = data.ideas;
        }
        if (data && typeof data.worldRecord !== 'undefined') {
          worldRecord = Number(data.worldRecord);
        }
      } catch (e) {
        onlineIdeas = JSON.parse(localStorage.getItem('atw_secret_ideas') || '[]');
        worldRecord = Number(localStorage.getItem('atw_world_record') || 0);
      }
    }

    async function saveIdeasToCloud() {
      localStorage.setItem('atw_secret_ideas', JSON.stringify(onlineIdeas));
      localStorage.setItem('atw_world_record', worldRecord);
      try {
        await fetch(CLOUD_BIN_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ideas: onlineIdeas, worldRecord: worldRecord })
        });
      } catch (e) {}
    }

    function startFlappyBoing() {
      document.getElementById('flappy-overlay').style.display = 'flex';
      canvas = document.getElementById('flappy-canvas');
      ctx = canvas.getContext('2d');
      
      loadIdeasFromCloud();
      resetGame();
      
      window.addEventListener('keydown', handleKeyPress);
      canvas.addEventListener('click', handleCanvasClick);

      if (!gameInterval) {
        gameInterval = setInterval(updateGame, 1000 / 60);
      }
    }

    function closeFlappyBoing() {
      document.getElementById('flappy-overlay').style.display = 'none';
      clearInterval(gameInterval);
      gameInterval = null;
      window.removeEventListener('keydown', handleKeyPress);
      canvas.removeEventListener('click', handleCanvasClick);
    }

    function resetGame() {
      bird = { x: 80, y: 250, radius: 15, gravity: 0.5, lift: -8, velocity: 0 };
      pipes = [];
      score = 0;
      isGameOver = false;
      isGameStarted = false;
    }

    function handleKeyPress(e) {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        makeBirdBounce();
      }
    }

    function handleCanvasClick() {
      makeBirdBounce();
    }

    function makeBirdBounce() {
      if (isGameOver) {
        resetGame();
        return;
      }
      isGameStarted = true;
      bird.velocity = bird.lift;
    }

    function updateGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isGameStarted && !isGameOver) {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
          let minHeight = 50, maxHeight = canvas.height - 200;
          let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
          let gap = 130;
          pipes.push({ x: canvas.width, top: height, bottom: canvas.height - height - gap, passed: false });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
          pipes[i].x -= 3;
          if (bird.x + bird.radius > pipes[i].x && bird.x - bird.radius < pipes[i].x + 60 &&
            (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > canvas.height - pipes[i].bottom)) {
            isGameOver = true;
          }
          if (!pipes[i].passed && pipes[i].x + 60 < bird.x) {
            score++;
            pipes[i].passed = true;
            if (score > worldRecord) {
              worldRecord = score;
              saveIdeasToCloud();
            }
          }
          if (pipes[i].x < -60) pipes.splice(i, 1);
        }

        if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) isGameOver = true;
      }

      for (let i = 0; i < pipes.length; i++) {
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(pipes[i].x, 0, 60, pipes[i].top);
        ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, 60, pipes[i].bottom);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(pipes[i].x, 0, 60, pipes[i].top);
        ctx.strokeRect(pipes[i].x, canvas.height - pipes[i].bottom, 60, pipes[i].bottom);
      }

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ff0000';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = '20px "Oswald", Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Score: ' + score, 20, 30);
      ctx.fillText('Record Mondial: ' + worldRecord, 20, 60);

      let personalBest = Number(localStorage.getItem('atw_personal_best') || 0);
      if (score > personalBest) {
        localStorage.setItem('atw_personal_best', score);
        personalBest = score;
      }
      ctx.fillText('Mon Record: ' + personalBest, 20, 90);

      if (!isGameStarted) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.textAlign = 'center';
        ctx.font = '28px "Oswald", Arial';
        ctx.fillText('CLIQUEZ OU ESPACE POUR BOUNCER', canvas.width / 2, canvas.height / 2);
      } else if (isGameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.textAlign = 'center';
        ctx.font = '36px "Oswald", Arial';
        ctx.fillText('KO !', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText('Clique pour recommencer', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function openIdeaBox() {
      document.getElementById('idea-overlay').style.display = 'flex';
      document.getElementById('success-msg').style.display = 'none';
    }

    function closeIdeaBox() {
      document.getElementById('idea-overlay').style.display = 'none';
    }

    async function submitIdeaOnline() {
      const pseudo = document.getElementById('pseudo').value.trim();
      const discord = document.getElementById('discord').value.trim();
      const text = document.getElementById('idea-text').value.trim();

      if (!pseudo || !text) {
        alert("Remplis ton pseudo et ton idée bg.");
        return;
      }

      await loadIdeasFromCloud();

      const uniqueId = Date.now() + Math.random();
      onlineIdeas.push({
        id: uniqueId,
        pseudo,
        discord: discord || 'Aucun',
        text,
        status: 'pending',
        date: new Date().toLocaleDateString()
      });

      await saveIdeasToCloud();

      document.getElementById('success-msg').style.display = 'block';
      document.getElementById('pseudo').value = '';
      document.getElementById('discord').value = '';
      document.getElementById('idea-text').value = '';
      setTimeout(() => {
        closeIdeaBox();
      }, 1500);
    }

    let typedCode = "";
    window.addEventListener('keydown', function(e) {
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
      
      if (e.key >= '0' && e.key <= '9') {
        typedCode += e.key;
        if (typedCode.length > 7) {
          typedCode = typedCode.slice(-7);
        }
        if (typedCode === "1710666") {
          openSecretDrawer();
          typedCode = "";
        }
      }
    });

    function checkTrashExpiration(ideas) {
      const now = Date.now();
      const trashTimeoutMs = 666 * 60 * 1000;
      return ideas.map(item => {
        if (item.status === 'trash' && item.trashTime) {
          if (now - item.trashTime > trashTimeoutMs) {
            return null;
          }
        }
        return item;
      }).filter(Boolean);
    }

    async function openSecretDrawer() {
      const overlay = document.getElementById('secret-drawer-overlay');
      overlay.style.display = 'flex';
      playDrawerSound();
      
      setTimeout(() => {
        overlay.classList.add('active');
      }, 10);

      await loadIdeasFromCloud();
      onlineIdeas = checkTrashExpiration(onlineIdeas);
      await saveIdeasToCloud();

      renderIdeas();
    }

    function closeSecretDrawer() {
      const overlay = document.getElementById('secret-drawer-overlay');
      playDrawerSound();
      overlay.classList.remove('active');
      
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 300);
    }

    function switchDrawerTab(tab, btnElement) {
      currentDrawerTab = tab;
      document.querySelectorAll('.drawer-tab').forEach(b => {
        if(b.id !== 'btn-empty-trash') b.classList.remove('active');
      });
      btnElement.classList.add('active');

      const emptyTrashBtn = document.getElementById('btn-empty-trash');
      emptyTrashBtn.style.display = (currentDrawerTab === 'trash') ? 'block' : 'none';

      renderIdeas();
    }

    async function updateIdeaStatus(id, newStatus) {
      await loadIdeasFromCloud();
      onlineIdeas = onlineIdeas.map(item => {
        if (Number(item.id) === Number(id)) {
          item.status = newStatus;
          if (newStatus === 'trash') {
            item.trashTime = Date.now();
          }
        }
        return item;
      });
      await saveIdeasToCloud();
      renderIdeas();
    }

    async function burnIdeaWithAnimation(id) {
      const card = document.getElementById(`card-${id}`);
      if (card) {
        playBurnSound();
        card.classList.add('burning');
        setTimeout(async () => {
          await deleteIdeaForever(id);
        }, 300);
      } else {
        await deleteIdeaForever(id);
      }
    }

    async function deleteIdeaForever(id) {
      await loadIdeasFromCloud();
      onlineIdeas = onlineIdeas.filter(item => Number(item.id) !== Number(id));
      await saveIdeasToCloud();
      renderIdeas();
    }

    async function emptyTrashWithEffect() {
      const cards = document.querySelectorAll('.idea-card');
      if (cards.length === 0) return;

      playBurnSound();
      cards.forEach(card => card.classList.add('burning'));

      setTimeout(async () => {
        await loadIdeasFromCloud();
        onlineIdeas = onlineIdeas.filter(item => item.status !== 'trash');
        await saveIdeasToCloud();
        renderIdeas();
      }, 300);
    }

    function getRemainingTrashTime(trashTime) {
      if (!trashTime) return "666 min restantes";
      const elapsedMs = Date.now() - trashTime;
      const totalMs = 666 * 60 * 1000;
      const remainingMs = totalMs - elapsedMs;
      const remainingMin = Math.ceil(remainingMs / (60 * 1000));
      if (remainingMin <= 0) return "Expiant...";
      return `${remainingMin} min restantes`;
    }

    function renderIdeas() {
      const listContainer = document.getElementById('ideas-list');
      const filteredIdeas = onlineIdeas.filter(item => {
        if (!item.status) item.status = 'pending';
        return item.status === currentDrawerTab;
      });

      if (filteredIdeas.length === 0) {
        listContainer.innerHTML = `<p style="color: #555; text-align: center; padding: 60px 0; font-family: Arial, sans-serif;">Aucune idée dans cette section...</p>`;
        return;
      }

      listContainer.innerHTML = filteredIdeas.map(item => `
        <div class="idea-card" id="card-${item.id}">
          <div class="idea-card-main">
            <div class="idea-card-header">
              <span class="idea-author">${item.pseudo}</span>
              <span class="idea-discord">Discord: ${item.discord}</span>
              <span class="idea-date">${item.date || ''}</span>
              ${currentDrawerTab === 'trash' ? `<span class="trash-timer">⏳ ${getRemainingTrashTime(item.trashTime)}</span>` : ''}
            </div>
            <p class="idea-text">${item.text}</p>
          </div>
          <div class="idea-card-actions">
            ${currentDrawerTab !== 'accepted' ? `<button class="action-btn btn-accept" onclick="updateIdeaStatus(${item.id}, 'accepted')">✔ Accepter</button>` : ''}
            ${currentDrawerTab !== 'rejected' ? `<button class="action-btn btn-reject" onclick="updateIdeaStatus(${item.id}, 'rejected')">✖ Refuser</button>` : ''}
            ${currentDrawerTab !== 'pending' && currentDrawerTab !== 'trash' ? `<button class="action-btn btn-pending" onclick="updateIdeaStatus(${item.id}, 'pending')">↺ En attente</button>` : ''}
            
            ${currentDrawerTab === 'trash' ? `
              <button class="action-btn btn-restore" onclick="updateIdeaStatus(${item.id}, 'pending')">♻ Restaurer</button>
              <button class="action-btn btn-burn" onclick="burnIdeaWithAnimation(${item.id})">🔥 Brûler</button>
            ` : `
              <button class="action-btn btn-trash" onclick="updateIdeaStatus(${item.id}, 'trash')"">🗑️ Jeter</button>
            `}
          </div>
        </div>
      `).join('');
    }
  </script>

</body>
</html>
